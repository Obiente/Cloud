# Health probes and explicitly labeled metrics endpoints. Grafana routes firing rules to its configured contact point.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: obiente-cloud
rule_files:
- /etc/prometheus/alert_rules.yml
scrape_configs:
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
- job_name: blackbox
  static_configs:
  - targets:
    - blackbox-exporter:9115
- job_name: swarm-metrics
  dockerswarm_sd_configs:
  - host: unix:///var/run/docker.sock
    role: tasks
  relabel_configs:
  - source_labels:
    - __meta_dockerswarm_service_label_prometheus_scrape
    regex: 'true'
    action: keep
  - source_labels:
    - __meta_dockerswarm_task_desired_state
    regex: running
    action: keep
  - source_labels:
    - __meta_dockerswarm_network_name
    regex: (.*_)?obiente-network
    action: keep
  - source_labels:
    - __address__
    - __meta_dockerswarm_service_label_prometheus_port
    regex: (.+):[0-9]+;([0-9]+)
    replacement: ${1}:${2}
    target_label: __address__
  - source_labels:
    - __meta_dockerswarm_service_name
    target_label: service
  - source_labels:
    - __meta_dockerswarm_node_hostname
    target_label: node
- job_name: health-api-gateway
  metrics_path: /probe
  params:
    module:
    - http_2xx
  static_configs:
  - targets:
    - api-gateway:3001
  dns_sd_configs:
  - names:
    - tasks.api-gateway
    type: A
    port: 3001
  relabel_configs:
  - source_labels:
    - __address__
    replacement: http://${1}/health
    target_label: __param_target
  - source_labels:
    - __param_target
    target_label: instance
  - replacement: api-gateway
    target_label: service
  - replacement: blackbox-exporter:9115
    target_label: __address__
