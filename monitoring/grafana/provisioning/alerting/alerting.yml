apiVersion: 1
contactPoints:
- orgId: 1
  name: default-email
  receivers:
  - uid: email-default
    type: email
    settings:
      addresses: ${ALERT_EMAIL:-admin@example.com}
      singleEmail: false
policies:
- orgId: 1
  receiver: default-email
  group_by:
  - alertname
  - cluster
  - service
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  routes:
  - matchers:
    - severity = critical
    receiver: default-email
    group_wait: 0s
    repeat_interval: 1h
  - matchers:
    - severity = warning
    receiver: default-email
    group_wait: 30s
    repeat_interval: 6h
groups:
- orgId: 1
  name: obiente-system-health
  folder: Obiente Cloud
  interval: 1m
  rules:
  - uid: obiente-critical
    title: Obiente critical alerts
    condition: B
    data:
    - refId: A
      queryType: ''
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        expr: sum(ALERTS{alertstate="firing",severity="critical"}) or vector(0)
        intervalMs: 15000
        maxDataPoints: 43200
        format: time_series
    - refId: B
      queryType: ''
      datasourceUid: '-100'
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
          type: query
        datasource:
          type: __expr__
          uid: '-100'
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: classic_conditions
    noDataState: Alerting
    execErrState: Alerting
    for: 1m
    annotations:
      summary: Obiente Cloud has firing critical alerts
      description: Open Prometheus Alerts for affected services and details.
    labels:
      severity: critical
  - uid: obiente-warning
    title: Obiente warning alerts
    condition: B
    data:
    - refId: A
      queryType: ''
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        expr: sum(ALERTS{alertstate="firing",severity="warning"}) or vector(0)
        intervalMs: 15000
        maxDataPoints: 43200
        format: time_series
    - refId: B
      queryType: ''
      datasourceUid: '-100'
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
          type: query
        datasource:
          type: __expr__
          uid: '-100'
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: classic_conditions
    noDataState: Alerting
    execErrState: Alerting
    for: 1m
    annotations:
      summary: Obiente Cloud has firing warning alerts
      description: Open Prometheus Alerts for affected services and details.
    labels:
      severity: warning
muteTimings:
- orgId: 1
  name: maintenance-window
  time_intervals:
  - times:
    - start_time: 02:00
      end_time: 04:00
    weekdays:
    - saturday
    - sunday
    months:
    - '*'
    years:
    - '*'
