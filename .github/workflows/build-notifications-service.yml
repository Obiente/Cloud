name: Build and Push Notifications Service

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "apps/notifications-service/**"
      - "apps/shared/pkg/auth/**"
      - "apps/shared/pkg/database/**"
      - "apps/shared/pkg/email/**"
      - "apps/shared/pkg/health/**"
      - "apps/shared/pkg/logger/**"
      - "apps/shared/pkg/middleware/**"
      - "apps/shared/pkg/platform/**"
      - "apps/shared/pkg/services/organizations/**"
      - "apps/shared/proto/obiente/cloud/notifications/**"
      - "apps/shared/proto/obiente/cloud/common/**"
      - "packages/proto/proto/obiente/cloud/notifications/**"
      - "packages/proto/proto/obiente/cloud/common/**"
      - "apps/shared/go.mod"
      - "apps/shared/go.sum"
      - ".github/workflows/build-notifications-service.yml"
      - ".github/workflows/reusable-container-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/notifications-service/**"
      - "apps/shared/pkg/auth/**"
      - "apps/shared/pkg/database/**"
      - "apps/shared/pkg/email/**"
      - "apps/shared/pkg/health/**"
      - "apps/shared/pkg/logger/**"
      - "apps/shared/pkg/middleware/**"
      - "apps/shared/pkg/platform/**"
      - "apps/shared/pkg/services/organizations/**"
      - "apps/shared/proto/obiente/cloud/notifications/**"
      - "apps/shared/proto/obiente/cloud/common/**"
      - "packages/proto/proto/obiente/cloud/notifications/**"
      - "packages/proto/proto/obiente/cloud/common/**"
      - "apps/shared/go.mod"
      - "apps/shared/go.sum"
      - ".github/workflows/build-notifications-service.yml"
      - ".github/workflows/reusable-container-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Notifications Service
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      service-name: notifications-service
      display-name: Notifications Service
      publish: false

  publish:
    name: Publish Notifications Service
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      service-name: notifications-service
      display-name: Notifications Service
      publish: true
    secrets: inherit
