name: Sync Base Images to Obiente Registry

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: sync-base-images
  cancel-in-progress: false

jobs:
  sync:
    name: Sync ${{ matrix.name }} (${{ matrix.runner-label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: BuildKit
            runner: self-hosted
            runner-label: self-hosted
            primary: docker.io/moby/buildkit:buildx-stable-1
            fallback: ""
            target: dockerhub/moby/buildkit:buildx-stable-1
          - name: Go 1.25 Alpine
            runner: ubuntu-24.04
            runner-label: github-hosted
            primary: public.ecr.aws/docker/library/golang:1.25-alpine
            fallback: docker.io/library/golang:1.25-alpine
            target: dockerhub/library/golang:1.25-alpine
          - name: Alpine
            runner: ubuntu-24.04
            runner-label: github-hosted
            primary: public.ecr.aws/docker/library/alpine:latest
            fallback: docker.io/library/alpine:latest
            target: dockerhub/library/alpine:latest
          - name: Node 22 Alpine
            runner: ubuntu-24.04
            runner-label: github-hosted
            primary: public.ecr.aws/docker/library/node:22-alpine
            fallback: docker.io/library/node:22-alpine
            target: dockerhub/library/node:22-alpine
          - name: Node 20 Alpine
            runner: ubuntu-24.04
            runner-label: github-hosted
            primary: public.ecr.aws/docker/library/node:20-alpine
            fallback: docker.io/library/node:20-alpine
            target: dockerhub/library/node:20-alpine
          - name: Rust 1.75 Alpine
            runner: ubuntu-24.04
            runner-label: github-hosted
            primary: public.ecr.aws/docker/library/rust:1.75-alpine
            fallback: docker.io/library/rust:1.75-alpine
            target: dockerhub/library/rust:1.75-alpine
    env:
      LOCAL_REGISTRY: registry.obiente.cloud
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Obiente Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.LOCAL_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Mirror image
        env:
          PRIMARY_IMAGE: ${{ matrix.primary }}
          FALLBACK_IMAGE: ${{ matrix.fallback }}
          TARGET_PATH: ${{ matrix.target }}
        run: |
          set -euo pipefail
          target_image="${LOCAL_REGISTRY}/${TARGET_PATH}"

          sync_image() {
            local source_image="$1"
            local attempt
            for attempt in 1 2 3; do
              if docker buildx imagetools create --tag "$target_image" "$source_image"; then
                return 0
              fi
              if [[ "$attempt" -lt 3 ]]; then
                sleep $((attempt * 10))
              fi
            done
            return 1
          }

          if ! sync_image "$PRIMARY_IMAGE"; then
            if [[ -z "$FALLBACK_IMAGE" ]]; then
              echo "Unable to sync $PRIMARY_IMAGE" >&2
              exit 1
            fi
            sync_image "$FALLBACK_IMAGE"
          fi

          for attempt in 1 2 3; do
            if docker buildx imagetools inspect "$target_image"; then
              exit 0
            fi
            sleep 5
          done

          echo "Unable to verify $target_image after syncing" >&2
          exit 1
