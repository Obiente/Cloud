name: Reusable Container Build

on:
  workflow_call:
    inputs:
      service-name:
        description: Directory name below apps/ and suffix of the GHCR image name
        required: true
        type: string
      display-name:
        description: Human-readable service name used in job names
        required: true
        type: string
      commit-arg-prefix:
        description: Prefix for Docker build commit metadata arguments
        required: false
        default: ""
        type: string
      publish:
        description: Push architecture images and publish the multi-platform manifest
        required: false
        default: false
        type: boolean
      validation-cache-mode:
        description: BuildKit cache export mode used for pull request validation
        required: false
        default: max
        type: string
    secrets:
      REGISTRY_USERNAME:
        required: false
      REGISTRY_PASSWORD:
        required: false

jobs:
  build:
    name: ${{ inputs.display-name }} (${{ matrix.platform }}, ${{ matrix.runner-label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
            runner: ubuntu-24.04
            runner-label: github-hosted
          - platform: linux/arm64
            architecture: arm64
            runner: ubuntu-24.04-arm
            runner-label: github-hosted
    env:
      IMAGE_NAME: ghcr.io/obiente/cloud-${{ inputs.service-name }}
      LOCAL_REGISTRY: registry.obiente.cloud
      BASE_REGISTRY: registry.obiente.cloud/dockerhub
      CACHE_IMAGE: registry.obiente.cloud/buildcache/${{ inputs.service-name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Obiente Registry
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ${{ env.LOCAL_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Log in to GitHub Container Registry
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,enable=${{ inputs.publish }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Read commit subject
        id: commit
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: printf 'subject=%s\n' "$(git show -s --format=%s "$COMMIT_SHA")" >> "$GITHUB_OUTPUT"

      - name: Validate image
        if: ${{ !inputs.publish }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/${{ inputs.service-name }}/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:validation-${{ matrix.architecture }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_REGISTRY=docker.io
            TARGETOS=linux
            TARGETARCH=${{ matrix.architecture }}
            ${{ inputs.commit-arg-prefix }}COMMIT=${{ github.sha }}
            ${{ inputs.commit-arg-prefix }}COMMIT_MESSAGE=${{ steps.commit.outputs.subject }}
          cache-from: type=gha,scope=${{ inputs.service-name }}-${{ matrix.architecture }}
          cache-to: type=gha,scope=${{ inputs.service-name }}-${{ matrix.architecture }},mode=${{ inputs.validation-cache-mode }}
          platforms: ${{ matrix.platform }}

      - name: Build and push image by digest
        if: inputs.publish
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/${{ inputs.service-name }}/Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_REGISTRY=${{ env.BASE_REGISTRY }}
            TARGETOS=linux
            TARGETARCH=${{ matrix.architecture }}
            ${{ inputs.commit-arg-prefix }}COMMIT=${{ github.sha }}
            ${{ inputs.commit-arg-prefix }}COMMIT_MESSAGE=${{ steps.commit.outputs.subject }}
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}:${{ matrix.architecture }}
          cache-to: type=registry,ref=${{ env.CACHE_IMAGE }}:${{ matrix.architecture }},mode=max,ignore-error=true
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export image digest
        if: inputs.publish
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload image digest
        if: inputs.publish
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ inputs.service-name }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    name: Publish ${{ inputs.display-name }} multi-platform manifest
    if: inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE_NAME: ghcr.io/obiente/cloud-${{ inputs.service-name }}
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ inputs.service-name }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract manifest metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create multi-platform manifest
        env:
          MANIFEST_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          mapfile -t digest_files < <(find "$RUNNER_TEMP/digests" -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${#digest_files[@]}" -ne 2 ]]; then
            echo "Expected two architecture digests, found ${#digest_files[@]}" >&2
            exit 1
          fi

          tag_args=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && tag_args+=(--tag "$tag")
          done <<< "$MANIFEST_TAGS"
          if [[ "${#tag_args[@]}" -eq 0 ]]; then
            echo "No manifest tags were generated" >&2
            exit 1
          fi

          sources=()
          for digest in "${digest_files[@]}"; do
            sources+=("${IMAGE_NAME}@sha256:${digest}")
          done

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${MANIFEST_TAGS%%$'\n'*}"
