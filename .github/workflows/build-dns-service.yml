name: Build and Push DNS Service

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "apps/dns-service/**"
      - "apps/shared/pkg/database/**"
      - "apps/shared/pkg/health/**"
      - "apps/shared/pkg/metrics/**"
      - "apps/shared/go.mod"
      - "apps/shared/go.sum"
      - ".github/workflows/build-dns-service.yml"
      - ".github/workflows/reusable-container-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/dns-service/**"
      - "apps/shared/pkg/database/**"
      - "apps/shared/pkg/health/**"
      - "apps/shared/pkg/metrics/**"
      - "apps/shared/go.mod"
      - "apps/shared/go.sum"
      - ".github/workflows/build-dns-service.yml"
      - ".github/workflows/reusable-container-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate DNS Service
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      service-name: dns-service
      display-name: DNS Service
      publish: false

  publish:
    name: Publish DNS Service
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      service-name: dns-service
      display-name: DNS Service
      publish: true
    secrets: inherit
