name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: 'apps/**/go.sum'

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Derive Nx comparison SHAs
        uses: nrwl/nx-set-shas@v5

      - name: Run affected checks
        run: pnpm exec nx affected -t lint test test:ssr build typecheck

      - run: pnpm exec nx fix-ci
        if: always()

  billing-dns-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cloud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d cloud_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NX_NO_CLOUD: 'true'
      OBIENTE_TEST_POSTGRES_DSN: 'host=127.0.0.1 port=5432 user=test password=test dbname=cloud_test sslmode=disable'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: 'apps/**/go.sum'
      - run: pnpm install --frozen-lockfile
      - name: PostgreSQL DNS and payment regressions
        run: pnpm exec nx run-many --target=test --projects=dns-service,billing-service --excludeTaskDependencies --parallel=2 --command="go test -mod=readonly -race -count=1 ./..."

  dashboard-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NX_NO_CLOUD: 'true'
      PLAYWRIGHT_USE_BUILD: 'true'
      NUXT_HYDRATION_DIAGNOSTICS: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec nx run-many --targets=nuxt:build --projects=@obiente/dashboard
      - name: Dashboard recovery and admin regressions
        run: pnpm exec nx run-many --targets=e2e --projects=@obiente/dashboard -- --workers=1
        env:
          PLAYWRIGHT_GREP: 'audit-remediation|admin-interactions|hydration-recovery|popup-hydration|managed-backups|page-smoke.*admin'
      - name: Session renewal with authentication enabled
        run: pnpm exec nx run-many --targets=e2e --projects=@obiente/dashboard -- --workers=1
        env:
          PLAYWRIGHT_AUTH_TESTS: 'true'
          PLAYWRIGHT_GREP: 'auth-session'
