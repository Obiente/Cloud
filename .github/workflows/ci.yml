name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Start distributed Nx Cloud run
        run: pnpm dlx nx@21.6.10 start-ci-run --auto-apply-fixes="*format*,*lint*" --distribute-on="3 linux-medium-js" --stop-agents-after="lint,test,build,typecheck"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Derive Nx comparison SHAs
        uses: nrwl/nx-set-shas@v5

      - name: Run affected checks
        run: pnpm exec nx affected -t lint test build typecheck

      - run: pnpm exec nx fix-ci
        if: always()
