name: Build and Push Dashboard

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "apps/dashboard/**"
      - "packages/**"
      - "patches/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "nx.json"
      - "tsconfig.base.json"
      - ".github/workflows/build-dashboard.yml"
      - ".github/workflows/reusable-container-build.yml"
      - "tools/deployment-preflight/base_images.py"
  pull_request:
    branches:
      - main
    paths:
      - "apps/dashboard/**"
      - "packages/**"
      - "patches/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "nx.json"
      - "tsconfig.base.json"
      - ".github/workflows/build-dashboard.yml"
      - ".github/workflows/reusable-container-build.yml"
      - "tools/deployment-preflight/base_images.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Dashboard
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      service-name: dashboard
      display-name: Dashboard
      commit-arg-prefix: DASHBOARD_
      publish: false
      validation-cache-mode: min

  publish:
    name: Publish Dashboard
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      service-name: dashboard
      display-name: Dashboard
      commit-arg-prefix: DASHBOARD_
      publish: true
    secrets: inherit
