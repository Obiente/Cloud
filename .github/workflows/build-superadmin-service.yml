name: Build and Push Superadmin Service

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "apps/superadmin-service/**"
      - "apps/shared/pkg/auth/**"
      - "apps/shared/pkg/database/**"
      - "apps/shared/pkg/health/**"
      - "apps/shared/pkg/logger/**"
      - "apps/shared/pkg/middleware/**"
      - "apps/shared/pkg/notifications/**"
      - "apps/shared/pkg/platform/**"
      - "apps/shared/pkg/pricing/**"
      - "apps/shared/pkg/services/organizations/**"
      - "apps/shared/pkg/stripe/**"
      - "apps/shared/proto/obiente/cloud/auth/**"
      - "apps/shared/proto/obiente/cloud/common/**"
      - "apps/shared/proto/obiente/cloud/deployments/**"
      - "apps/shared/proto/obiente/cloud/notifications/**"
      - "apps/shared/proto/obiente/cloud/superadmin/**"
      - "apps/shared/proto/obiente/cloud/vpsgateway/**"
      - "apps/shared/proto/obiente/cloud/vps/**"
      - "packages/proto/proto/obiente/cloud/auth/**"
      - "packages/proto/proto/obiente/cloud/common/**"
      - "packages/proto/proto/obiente/cloud/deployments/**"
      - "packages/proto/proto/obiente/cloud/notifications/**"
      - "packages/proto/proto/obiente/cloud/superadmin/**"
      - "packages/proto/proto/obiente/cloud/vpsgateway/**"
      - "packages/proto/proto/obiente/cloud/vps/**"
      - "apps/shared/go.mod"
      - "apps/shared/go.sum"
      - ".github/workflows/build-superadmin-service.yml"
      - ".github/workflows/reusable-container-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/superadmin-service/**"
      - "apps/shared/pkg/auth/**"
      - "apps/shared/pkg/database/**"
      - "apps/shared/pkg/health/**"
      - "apps/shared/pkg/logger/**"
      - "apps/shared/pkg/middleware/**"
      - "apps/shared/pkg/notifications/**"
      - "apps/shared/pkg/platform/**"
      - "apps/shared/pkg/pricing/**"
      - "apps/shared/pkg/services/organizations/**"
      - "apps/shared/pkg/stripe/**"
      - "apps/shared/proto/obiente/cloud/auth/**"
      - "apps/shared/proto/obiente/cloud/common/**"
      - "apps/shared/proto/obiente/cloud/deployments/**"
      - "apps/shared/proto/obiente/cloud/notifications/**"
      - "apps/shared/proto/obiente/cloud/superadmin/**"
      - "apps/shared/proto/obiente/cloud/vpsgateway/**"
      - "apps/shared/proto/obiente/cloud/vps/**"
      - "packages/proto/proto/obiente/cloud/auth/**"
      - "packages/proto/proto/obiente/cloud/common/**"
      - "packages/proto/proto/obiente/cloud/deployments/**"
      - "packages/proto/proto/obiente/cloud/notifications/**"
      - "packages/proto/proto/obiente/cloud/superadmin/**"
      - "packages/proto/proto/obiente/cloud/vpsgateway/**"
      - "packages/proto/proto/obiente/cloud/vps/**"
      - "apps/shared/go.mod"
      - "apps/shared/go.sum"
      - ".github/workflows/build-superadmin-service.yml"
      - ".github/workflows/reusable-container-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Superadmin Service
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      service-name: superadmin-service
      display-name: Superadmin Service
      publish: false

  publish:
    name: Publish Superadmin Service
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      service-name: superadmin-service
      display-name: Superadmin Service
      publish: true
    secrets: inherit
