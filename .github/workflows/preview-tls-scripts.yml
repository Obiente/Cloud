name: Validate Preview TLS Scripts

on:
  pull_request:
    paths:
      - ".github/workflows/preview-tls-scripts.yml"
      - "scripts/manage-preview-tls.sh"
      - "scripts/install-preview-tls-renewal.sh"
      - "scripts/tests/manage-preview-tls-test.sh"
      - "scripts/tests/install-preview-tls-renewal-test.sh"
      - "scripts/internal/systemd/obiente-preview-tls-renew.*"
      - "tools/preview-tls-scripts/project.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/preview-tls-scripts.yml"
      - "scripts/manage-preview-tls.sh"
      - "scripts/install-preview-tls-renewal.sh"
      - "scripts/tests/manage-preview-tls-test.sh"
      - "scripts/tests/install-preview-tls-renewal-test.sh"
      - "scripts/internal/systemd/obiente-preview-tls-renew.*"
      - "tools/preview-tls-scripts/project.json"

permissions:
  contents: read

concurrency:
  group: preview-tls-scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Shell validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run preview TLS validation target
        run: pnpm exec nx run preview-tls-scripts:validate
