name: Build and Push Gameservers Service

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "apps/gameservers-service/**"
      - "apps/shared/pkg/auth/**"
      - "apps/shared/pkg/chunkupload/**"
      - "apps/shared/pkg/database/**"
      - "apps/shared/pkg/docker/**"
      - "apps/shared/pkg/health/**"
      - "apps/shared/pkg/logger/**"
      - "apps/shared/pkg/middleware/**"
      - "apps/shared/pkg/notifications/**"
      - "apps/shared/pkg/orchestrator/**"
      - "apps/shared/pkg/redis/**"
      - "apps/shared/pkg/services/common/**"
      - "apps/shared/pkg/utils/**"
      - "apps/shared/proto/obiente/cloud/gameservers/**"
      - "apps/shared/proto/obiente/cloud/common/**"
      - "apps/shared/proto/obiente/cloud/notifications/**"
      - "packages/proto/proto/obiente/cloud/gameservers/**"
      - "packages/proto/proto/obiente/cloud/common/**"
      - "packages/proto/proto/obiente/cloud/notifications/**"
      - "apps/shared/go.mod"
      - "apps/shared/go.sum"
      - ".github/workflows/build-gameservers-service.yml"
      - ".github/workflows/reusable-container-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/gameservers-service/**"
      - "apps/shared/pkg/auth/**"
      - "apps/shared/pkg/chunkupload/**"
      - "apps/shared/pkg/database/**"
      - "apps/shared/pkg/docker/**"
      - "apps/shared/pkg/health/**"
      - "apps/shared/pkg/logger/**"
      - "apps/shared/pkg/middleware/**"
      - "apps/shared/pkg/notifications/**"
      - "apps/shared/pkg/orchestrator/**"
      - "apps/shared/pkg/redis/**"
      - "apps/shared/pkg/services/common/**"
      - "apps/shared/pkg/utils/**"
      - "apps/shared/proto/obiente/cloud/gameservers/**"
      - "apps/shared/proto/obiente/cloud/common/**"
      - "apps/shared/proto/obiente/cloud/notifications/**"
      - "packages/proto/proto/obiente/cloud/gameservers/**"
      - "packages/proto/proto/obiente/cloud/common/**"
      - "packages/proto/proto/obiente/cloud/notifications/**"
      - "apps/shared/go.mod"
      - "apps/shared/go.sum"
      - ".github/workflows/build-gameservers-service.yml"
      - ".github/workflows/reusable-container-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Gameservers Service
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      service-name: gameservers-service
      display-name: Gameservers Service
      publish: false

  publish:
    name: Publish Gameservers Service
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      service-name: gameservers-service
      display-name: Gameservers Service
      publish: true
    secrets: inherit
