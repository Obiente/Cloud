name: Build and Push VPS Gateway

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "apps/vps-gateway/**"
      - "apps/shared/proto/obiente/cloud/vps/**"
      - "apps/shared/proto/obiente/cloud/vpsgateway/**"
      - "packages/proto/proto/obiente/cloud/vps/**"
      - "packages/proto/proto/obiente/cloud/vpsgateway/**"
      - "apps/shared/go.mod"
      - "apps/shared/go.sum"
      - ".github/workflows/build-vps-gateway.yml"
      - ".github/workflows/reusable-container-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/vps-gateway/**"
      - "apps/shared/proto/obiente/cloud/vps/**"
      - "apps/shared/proto/obiente/cloud/vpsgateway/**"
      - "packages/proto/proto/obiente/cloud/vps/**"
      - "packages/proto/proto/obiente/cloud/vpsgateway/**"
      - "apps/shared/go.mod"
      - "apps/shared/go.sum"
      - ".github/workflows/build-vps-gateway.yml"
      - ".github/workflows/reusable-container-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate VPS Gateway
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      service-name: vps-gateway
      display-name: VPS Gateway
      publish: false

  publish:
    name: Publish VPS Gateway
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      service-name: vps-gateway
      display-name: VPS Gateway
      publish: true
    secrets: inherit
