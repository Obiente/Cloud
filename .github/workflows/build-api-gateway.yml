name: Build and Push API Gateway

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "apps/api-gateway/**"
      - "apps/shared/pkg/logger/**"
      - "apps/shared/pkg/middleware/**"
      - "apps/shared/go.mod"
      - "apps/shared/go.sum"
      - ".github/workflows/build-api-gateway.yml"
      - ".github/workflows/reusable-container-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/api-gateway/**"
      - "apps/shared/pkg/logger/**"
      - "apps/shared/pkg/middleware/**"
      - "apps/shared/go.mod"
      - "apps/shared/go.sum"
      - ".github/workflows/build-api-gateway.yml"
      - ".github/workflows/reusable-container-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate API Gateway
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      service-name: api-gateway
      display-name: API Gateway
      publish: false

  publish:
    name: Publish API Gateway
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      service-name: api-gateway
      display-name: API Gateway
      publish: true
    secrets: inherit
