name: Service Recovery Regressions

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-recovery-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cloud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d cloud_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NX_NO_CLOUD: 'true'
      OBIENTE_TEST_POSTGRES_DSN: 'host=127.0.0.1 port=5432 user=test password=test dbname=cloud_test sslmode=disable'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: 'apps/**/go.sum'
      - run: pnpm install --frozen-lockfile
      - name: Shared authentication and SMTP regressions
        env:
          OBIENTE_TEST_POSTGRES_DSN: ''
        run: pnpm exec nx run shared:test --skip-nx-cache --command="go test -mod=readonly -race -count=1 ./..."
      - name: PostgreSQL DNS, billing, organization and email regressions
        run: pnpm exec nx run-many --target=test --projects=dns-service,billing-service,organizations-service,notifications-service --excludeTaskDependencies --parallel=2 --skip-nx-cache --command="go test -mod=readonly -race -count=1 ./..."
      - name: Deployment and game server regressions
        run: pnpm exec nx run-many --target=test --projects=deployments-service,gameservers-service --excludeTaskDependencies --parallel=2 --skip-nx-cache --command="go test -mod=readonly -race -count=1 ./..."
      - name: Shell-less container and mounted volume file browsing
        env:
          OBIENTE_TEST_POSTGRES_DSN: ''
          OBIENTE_DOCKER_TESTS: '1'
          DOCKER_HOST: unix:///var/run/docker.sock
        run: |
          docker pull busybox:1.37.0
          pnpm exec nx run shared:test --skip-nx-cache --command="go test -mod=readonly -race -count=1 ./pkg/docker -run '^TestShelllessContainerFileBrowser$'"
