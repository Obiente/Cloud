name: Build and Push Organizations Service

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "apps/organizations-service/**"
      - "apps/shared/pkg/auth/**"
      - "apps/shared/pkg/database/**"
      - "apps/shared/pkg/database/migrations/**"
      - "apps/shared/pkg/email/**"
      - "apps/shared/pkg/health/**"
      - "apps/shared/pkg/logger/**"
      - "apps/shared/pkg/middleware/**"
      - "apps/shared/pkg/notifications/**"
      - "apps/shared/pkg/platform/**"
      - "apps/shared/pkg/pricing/**"
      - "apps/shared/pkg/services/common/**"
      - "apps/shared/pkg/services/organizations/**"
      - "apps/shared/proto/obiente/cloud/auth/**"
      - "apps/shared/proto/obiente/cloud/common/**"
      - "apps/shared/proto/obiente/cloud/notifications/**"
      - "apps/shared/proto/obiente/cloud/organizations/**"
      - "packages/proto/proto/obiente/cloud/auth/**"
      - "packages/proto/proto/obiente/cloud/common/**"
      - "packages/proto/proto/obiente/cloud/notifications/**"
      - "packages/proto/proto/obiente/cloud/organizations/**"
      - "apps/shared/go.mod"
      - "apps/shared/go.sum"
      - ".github/workflows/build-organizations-service.yml"
      - ".github/workflows/reusable-container-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/organizations-service/**"
      - "apps/shared/pkg/auth/**"
      - "apps/shared/pkg/database/**"
      - "apps/shared/pkg/database/migrations/**"
      - "apps/shared/pkg/email/**"
      - "apps/shared/pkg/health/**"
      - "apps/shared/pkg/logger/**"
      - "apps/shared/pkg/middleware/**"
      - "apps/shared/pkg/notifications/**"
      - "apps/shared/pkg/platform/**"
      - "apps/shared/pkg/pricing/**"
      - "apps/shared/pkg/services/common/**"
      - "apps/shared/pkg/services/organizations/**"
      - "apps/shared/proto/obiente/cloud/auth/**"
      - "apps/shared/proto/obiente/cloud/common/**"
      - "apps/shared/proto/obiente/cloud/notifications/**"
      - "apps/shared/proto/obiente/cloud/organizations/**"
      - "packages/proto/proto/obiente/cloud/auth/**"
      - "packages/proto/proto/obiente/cloud/common/**"
      - "packages/proto/proto/obiente/cloud/notifications/**"
      - "packages/proto/proto/obiente/cloud/organizations/**"
      - "apps/shared/go.mod"
      - "apps/shared/go.sum"
      - ".github/workflows/build-organizations-service.yml"
      - ".github/workflows/reusable-container-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Organizations Service
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      service-name: organizations-service
      display-name: Organizations Service
      publish: false

  publish:
    name: Publish Organizations Service
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      service-name: organizations-service
      display-name: Organizations Service
      publish: true
    secrets: inherit
