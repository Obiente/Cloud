name: Build and Push File Transfer Service

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "apps/file-transfer-service/**"
      - "apps/shared/pkg/database/**"
      - "apps/shared/pkg/health/**"
      - "apps/shared/pkg/logger/**"
      - "apps/shared/pkg/middleware/**"
      - "apps/shared/pkg/redis/**"
      - "apps/shared/go.mod"
      - "apps/shared/go.sum"
      - ".github/workflows/build-file-transfer-service.yml"
      - ".github/workflows/reusable-container-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/file-transfer-service/**"
      - "apps/shared/pkg/database/**"
      - "apps/shared/pkg/health/**"
      - "apps/shared/pkg/logger/**"
      - "apps/shared/pkg/middleware/**"
      - "apps/shared/pkg/redis/**"
      - "apps/shared/go.mod"
      - "apps/shared/go.sum"
      - ".github/workflows/build-file-transfer-service.yml"
      - ".github/workflows/reusable-container-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate File Transfer Service
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      service-name: file-transfer-service
      display-name: File Transfer Service
      publish: false

  publish:
    name: Publish File Transfer Service
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      service-name: file-transfer-service
      display-name: File Transfer Service
      publish: true
    secrets: inherit
